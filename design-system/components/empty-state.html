<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Empty state</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#E8EDF7;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#161A23;-webkit-font-smoothing:antialiased;}.wrap{width:860px;padding:28px 30px;box-sizing:border-box;}h2{font-size:15px;font-weight:600;margin:0 0 4px;}p.note{font-size:12.5px;color:#5F667A;margin:0 0 20px;max-width:760px;line-height:1.6;}</style></head><body><div class="wrap"><h2>Empty state</h2><p class="note">The real queue holds one document, so it is empty most of the time. An approval tool that reads as broken when there is nothing to approve is a failure. This has to read as finished.</p><div style="display:flex; flex-direction:column; align-items:center; gap:9px; padding:28px 24px; background:#FFFFFF; border:1px solid #D8DCE8; border-radius:12px;"><span style="width:42px; height:42px; border-radius:50%; background:#EAF5EC; display:flex; align-items:center; justify-content:center;"><svg width='20' height='20' viewBox='0 0 16 16' fill='none'><path d='m3.6 8.3 2.9 2.9 5.9-6.1' stroke='#3D9A50' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg></span><span style="font-size:15px; font-weight:600;">Nothing is waiting for you</span><span style="font-size:13px; color:#5F667A;">Every document the pipeline has read has been decided.</span></div></div></body></html>
